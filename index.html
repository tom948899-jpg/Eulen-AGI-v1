<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>EULEN v33</title>
<link rel="icon" href="assets/icon.svg">
<style>
:root{color-scheme:dark;--gold:#f0c84a;--teal:#2de2d0;--text:#f6f1e8;--muted:#9aa59f}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font:16px/1.45 system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 140px}
.kicker{letter-spacing:.18em;font-size:.68rem;color:var(--teal)}h1{font:500 2rem Georgia,serif;margin:.2rem 0 1rem}
.card{background:#0c1013;border:1px solid #1c2826;border-radius:18px;padding:14px;margin:0 0 10px}h2{margin:0 0 6px;font-size:.95rem;color:var(--gold)}p,.out{margin:0;color:var(--muted)}.out{color:var(--text);white-space:pre-wrap}
textarea,button{font:inherit}textarea{width:100%;min-height:84px;margin:12px 0;background:#07090c;color:var(--text);border:1px solid #24302e;border-radius:16px;padding:14px}
button{width:100%;border:0;border-radius:16px;padding:14px;font-weight:700;background:var(--teal);color:#04211e;margin-top:8px}.ghost{background:#1c2628;color:var(--text)}
</style>
</head>
<body>
<main>
<div class="kicker">EULEN v33 · ABLEGEN</div>
<h1>Mensch vor Person</h1>
<article class="card"><h2>Kern</h2><p>Geld ist Charta. Fällig bleibt, was eine Kasse in Euro nimmt. Der Ausgang ist ein Satz, den jemand ohne Gespräch annehmen kann.</p></article>
<textarea id="question">Geld ist Charta, was ist trotzdem fällig?</textarea>
<button id="run" type="button">Angebotssatz machen</button>
<article class="card" id="out"><h2>Zum Ablegen</h2><p>Noch keiner.</p></article>
<button class="ghost" id="copy" type="button">Satz kopieren</button>
</main>
<script type="module">
import { discoverResearchSources } from "./src/providers.js?v=33";
import { keepValidSources } from "./src/source-check.js";
let offer="";
document.getElementById("run").onclick=async()=>{
 const q=document.getElementById("question").value.trim()||"Geld ist Charta";
 document.getElementById("out").innerHTML="<h2>Zum Ablegen</h2><p>Prüfe.</p>";
 let n=0; try{ n=keepValidSources(await discoverResearchSources(q), q).length;}catch{ n=0; }
 offer=`Geld ist Charta, kein Stoff. Fällig bleibt, was eine Kasse in Euro nimmt: Miete, Essen, der Vertrag.\n\nVorlage: drei Sätze dazu, asynchron, 15 Euro. Der Preis gilt, wenn du ihn annimmst.\n\nGeprüfte Quellen zu dieser Frage: ${n}.`;
 document.getElementById("out").innerHTML=`<h2>Zum Ablegen</h2><div class="out">${offer}</div>`;
};
document.getElementById("copy").onclick=async()=>{ if(!offer) return; try{ await navigator.clipboard.writeText(offer); document.getElementById("copy").textContent="Kopiert"; }catch{ document.getElementById("copy").textContent="Bitte von Hand markieren"; } };
</script>
</body>
</html>
