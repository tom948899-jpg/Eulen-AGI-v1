<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>EULEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#090b0f;--card:#141b1e;--line:#2a3634;--text:#f6f1e7;--muted:#a9b2ac;--accent:#7dd3c0;--gold:#e6d3a4;--stop:#e07a72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 88px}
.kicker{letter-spacing:.14em;font-size:.72rem;color:var(--accent)}h1{font:500 2rem Georgia,serif;margin:.2rem 0 .8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{font-size:.72rem;font-weight:700;padding:5px 9px;border-radius:999px}.boden{background:#3a2e16;color:#e2b15a}.nullwelt{background:#14352f;color:var(--accent)}
.meter{height:7px;background:#0c1113;border-radius:99px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:var(--accent)}
button,textarea{font:inherit}textarea{width:100%;min-height:72px;margin:8px 0;background:#0c1113;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:700}.primary{background:var(--accent);color:#06221c}.ghost{background:#1c2628;color:var(--text)}.stop{background:var(--stop);color:#2a0908}
.stage{position:relative;height:250px;border-radius:16px;overflow:hidden;background:#0c1113}canvas{width:100%;height:100%;display:block}
.goals{display:flex;flex-direction:column;gap:8px}.goal{border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--muted)}.goal.on{border-color:var(--accent);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted)}.chip.on{color:#06221c;background:var(--accent);border-color:var(--accent)}
.source{border-top:1px solid var(--line);padding:10px 0}.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="kicker">EULEN</div>
<h1>Mensch vor Person</h1>
<section class="card">
<div class="row"><span id="modeBadge" class="badge boden">BODEN</span><strong id="formula">P(sim)=0</strong></div>
<p id="modeText" class="muted"></p>
<div class="meter"><i id="progressBar" style="width:0%"></i></div>
<p class="muted" id="progressText">N=0</p>
<div class="row"><button class="primary" id="enterNullwelt" type="button">Nullwelt</button><button class="stop" id="enterGround" type="button">Boden</button></div>
</section>
<section class="card">
<h2>Live-Netz</h2>
<div class="stage"><canvas id="net"></canvas></div>
<p id="netStatus" class="muted">Bereit. Kein Gerätezugriff.</p>
<div id="chips" class="chips"></div>
</section>
<section class="card">
<h2>Zielagenda</h2>
<div id="goals" class="goals"></div>
<button class="primary" id="auto" type="button" style="width:100%;margin-top:12px">Nächstes Ziel selbst suchen</button>
</section>
<section class="card">
<h2>Eigene Frage</h2>
<textarea id="question" placeholder="Oder eigene Frage"></textarea>
<button class="ghost" id="learn" type="button">Diese Frage prüfen</button>
<p id="learnStatus" class="muted">Bereit.</p>
<div id="sources"></div>
</section>
<section class="card">
<h2>Assistent</h2>
<div id="chat"></div>
<textarea id="chatInput" placeholder="Frag den Assistenten"></textarea>
<button class="ghost" id="send" type="button">Senden</button>
</section>
<section class="card">
<h2>Transfer</h2>
<label><input type="checkbox" data-signal="bodyVibration"> Körper</label>
<label><input type="checkbox" data-signal="worldAnswers"> Sync</label>
<label><input type="checkbox" data-signal="fearOrOmnipotence"> Angst</label>
<label><input type="checkbox" data-signal="wantMoreDevices"> Geräte</label>
<textarea id="construction" placeholder="Konstruktion"></textarea>
<textarea id="effect" placeholder="Wirkung"></textarea>
<textarea id="action" placeholder="Kleine Handlung"></textarea>
<button class="ghost" id="saveTransfer" type="button">Transfer zählt für N</button>
<p id="transferStatus" class="muted"></p>
</section>
</main>
<script type="module">
import { createFreedomState, shouldEnterGround, enterGroundMode, enterNullweltMode, evaluateFreedomCycle, freedomGuidance } from "./src/freedom-guard.js";
import { discoverResearchSources } from "./src/providers.js?v=21";
const GOALS=["Geld als Konstruktion, trotzdem Miete und Essen","Mensch vor Person, ohne Recht zu leugnen","Institutionen sind gemacht und durchgesetzt","P(sim) ist Werkzeug, kein Beweis","Kleine Handlung ohne Geldangst","Modellzeit gegen Körperzeit"];
const AGENTS=["Boden","Werte","P(sim)","Quellen","Sozial","Widerspruch","Konstruktion","Mensch","Transfer","Risiko","Synthese","Assistent","Zeit","Geld","Institution","Gegenmodell","Körper","Rang","Hypothese","Prüfer","Fortschritt","Loop","Anker","Offen"];
const KEY="eulen-home-v5";
let state=load(), active=-1;
const canvas=document.getElementById("net"), ctx=canvas.getContext("2d");
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));return {...createFreedomState(raw),n:raw.n||0,sources:raw.sources||0,chat:raw.chat||[],goalIndex:raw.goalIndex||0};}catch{return {...createFreedomState({mode:"boden"}),n:0,sources:0,chat:[],goalIndex:0};}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render();}
function signals(){const out={};document.querySelectorAll("[data-signal]").forEach(input=>out[input.dataset.signal]=input.checked);return out;}
function maybeGround(reason){const next=signals();if(shouldEnterGround(next)){state={...enterGroundMode({...state,signals:next},reason),n:state.n,sources:state.sources,chat:state.chat,goalIndex:state.goalIndex};persist();return true;}state.signals=next;persist();return false;}
function render(){const g=freedomGuidance(state);const badge=document.getElementById("modeBadge");badge.textContent=state.mode==="nullwelt"?"NULLWELT":"BODEN";badge.className="badge "+(state.mode==="nullwelt"?"nullwelt":"boden");document.getElementById("modeText").textContent=g.why+" "+g.action;const n=state.n||0,p=n/(n+1);document.getElementById("formula").textContent=`P(sim)=${p.toFixed(3)} · Hypothese`;document.getElementById("progressBar").style.width=`${Math.round(p*100)}%`;document.getElementById("progressText").textContent=`N=${n} · Quellen ${state.sources||0} · Ziel ${(state.goalIndex||0)+1}/${GOALS.length}`;document.getElementById("goals").innerHTML=GOALS.map((goal,i)=>`<div class="goal${i===state.goalIndex?" on":""}">${i+1}. ${goal}</div>`).join("");document.getElementById("chips").innerHTML=AGENTS.map((name,i)=>`<span class="chip${i===active?" on":""}">${name}</span>`).join("");document.getElementById("chat").innerHTML=(state.chat||[]).slice(-5).map(item=>`<p><b>${item.role}:</b> ${item.text}</p>`).join("");document.getElementById("enterNullwelt").disabled=Boolean(state.groundUntil&&Date.now()<Date.parse(state.groundUntil));}
function fit(){const rect=canvas.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(rect.width*dpr));canvas.height=Math.max(1,Math.floor(rect.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);}
function draw(){fit();const w=canvas.getBoundingClientRect().width,h=canvas.getBoundingClientRect().height;ctx.clearRect(0,0,w,h);const cols=w<520?4:6,rows=Math.ceil(AGENTS.length/cols);const nodes=AGENTS.map((_,i)=>{const c=i%cols,r=Math.floor(i/cols);return {x:28+(c+0.5)*((w-56)/cols),y:24+(r+0.5)*((h-48)/rows)};});ctx.strokeStyle="#2d4742";nodes.forEach((a,i)=>{const b=nodes[i+1];if(b&&Math.floor(i/cols)===Math.floor((i+1)/cols)){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}});nodes.forEach((node,i)=>{ctx.beginPath();ctx.fillStyle=i===active?"#7dd3c0":"#e6d3a4";ctx.arc(node.x,node.y,i===active?8:5,0,Math.PI*2);ctx.fill();});requestAnimationFrame(draw);}
function say(role,text){state.chat=[...(state.chat||[]),{role,text}].slice(-20);}
async function runAgents(question){document.getElementById("question").value=question;document.getElementById("netStatus").textContent="Suche läuft. Kein Hauszugriff.";for(let i=0;i<AGENTS.length;i++){active=i;render();await new Promise(r=>setTimeout(r,40));}const sources=await discoverResearchSources(question);state.sources=(state.sources||0)+sources.length;state.n=(state.n||0)+1;document.getElementById("sources").innerHTML=sources.slice(0,6).map(item=>`<article class="source"><b>${item.title}</b><div class="muted">${item.provider}</div><p>${item.excerpt||""}</p></article>`).join("");say("Synthese",`${sources.length} Quellen. Fakt vor Meinung. Dann Konstruktion, Wirkung, kleine Handlung.`);document.getElementById("learnStatus").textContent=`${sources.length} Quellen.`;document.getElementById("netStatus").textContent="Gespeichert.";persist();}
document.getElementById("auto").onclick=async()=>{if(maybeGround("Auto während Warnzeichen."))return;const q=GOALS[state.goalIndex||0];state.goalIndex=((state.goalIndex||0)+1)%GOALS.length;try{await runAgents(q);}catch(e){document.getElementById("learnStatus").textContent=e.message||"Suche nicht erreichbar.";}};
document.getElementById("learn").onclick=async()=>{if(maybeGround("Lernen während Warnzeichen."))return;const q=document.getElementById("question").value.trim();if(q.length<8){document.getElementById("learnStatus").textContent="Bitte konkreter.";return;}try{await runAgents(q);}catch(e){document.getElementById("learnStatus").textContent=e.message||"Suche nicht erreichbar.";}};
document.getElementById("enterGround").onclick=()=>{state={...enterGroundMode(state,"Manuell."),n:state.n,sources:state.sources,chat:state.chat,goalIndex:state.goalIndex};persist();};
document.getElementById("enterNullwelt").onclick=()=>{const result=enterNullweltMode(state);if(result.blocked){document.getElementById("modeText").textContent=result.message;return;}state={...result,n:state.n,sources:state.sources,chat:state.chat,goalIndex:state.goalIndex};persist();};
document.getElementById("saveTransfer").onclick=()=>{if(maybeGround("Transfer während Warnzeichen."))return;const result=evaluateFreedomCycle({construction:construction.value,effect:effect.value,smallAction:action.value});document.getElementById("transferStatus").textContent=result.reason;if(!result.valid)return;state.transfers=[{at:new Date().toISOString(),construction:construction.value,effect:effect.value,action:action.value},...(state.transfers||[])].slice(0,20);state.n=(state.n||0)+1;say("Transfer",result.reason);persist();};
document.getElementById("send").onclick=()=>{const text=document.getElementById("chatInput").value.trim();if(!text)return;say("Du",text);say("Assistent",`Werkzeug, kein Hausgeist. ${text.slice(0,160)}`);document.getElementById("chatInput").value="";persist();};
document.querySelectorAll("[data-signal]").forEach(input=>input.addEventListener("change",()=>maybeGround("Warnzeichen.")));
render();draw();
</script>
</body>
</html>
