<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b0f">
<title>EULEN · Freiheit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#090b0f;--line:#243036;--text:#f4f0e8;--muted:#a7b0aa;--accent:#7dd3c0;--gold:#e8d6a8;--stop:#e07a72}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#090b0f;color:var(--text)}
main{max-width:980px;margin:0 auto;padding:16px 14px 72px}
h1{font:500 1.7rem Georgia,serif;margin:.1rem 0}h2{font-size:1rem;margin:0 0 .35rem}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.card{background:#12181b;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
canvas{width:100%;height:280px;background:#0c1113;border-radius:14px}textarea{width:100%;min-height:64px;background:#0c1113;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 12px;font-weight:650}.primary{background:var(--accent);color:#06221c}.ghost{background:#1c2628;color:var(--text)}.stop{background:var(--stop);color:#2a0908}
.badge{font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:999px}.boden{background:#3a2e16;color:#e2b15a}.nullwelt{background:#14352f;color:var(--accent)}
.meter{height:8px;background:#0c1113;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.chat{min-height:120px;max-height:220px;overflow:auto}.source{border-top:1px solid var(--line);padding:8px 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div class="muted">EULEN · Repo ist das Gedächtnis</div><h1>Mensch vor Person</h1></header>
<section class="card"><div class="row"><span id="modeBadge" class="badge boden">BODEN</span><strong id="formula">P(sim)=0</strong></div><p id="modeText" class="muted"></p><div class="meter"><i id="progressBar" style="width:0%"></i></div><p class="muted" id="progressText">N=0</p><div class="row"><button class="primary" id="enterNullwelt" type="button">Nullwelt</button><button class="stop" id="enterGround" type="button">Boden</button></div></section>
<section class="grid"><article class="card"><h2>Live-Netz · 24 Knoten</h2><canvas id="net" width="900" height="420"></canvas><p class="muted" id="netStatus">Bereit. Kein Gerätezugriff.</p></article><article class="card"><h2>Zielagenda</h2><ol id="goals" class="muted"></ol><button class="primary" id="auto" type="button">Nächstes Ziel selbst suchen</button></article></section>
<section class="card"><h2>Lernen</h2><textarea id="question" placeholder="Oder eigene Frage"></textarea><button class="ghost" id="learn" type="button">Diese Frage prüfen</button><p id="learnStatus" class="muted">Bereit.</p><div id="sources"></div></section>
<section class="grid"><article class="card"><h2>Assistent</h2><div id="chat" class="chat"></div><textarea id="chatInput" placeholder="Frag den Assistenten"></textarea><button class="ghost" id="send" type="button">Senden</button></article><article class="card"><h2>Transfer</h2><label><input type="checkbox" data-signal="bodyVibration"> Körper</label> <label><input type="checkbox" data-signal="worldAnswers"> Sync</label> <label><input type="checkbox" data-signal="fearOrOmnipotence"> Angst</label> <label><input type="checkbox" data-signal="wantMoreDevices"> Geräte</label><textarea id="construction" placeholder="Konstruktion"></textarea><textarea id="effect" placeholder="Wirkung"></textarea><textarea id="action" placeholder="Kleine Handlung"></textarea><button class="ghost" id="saveTransfer" type="button">Transfer zählt für N</button><p id="transferStatus" class="muted"></p></article></section>
</main>
<script type="module">
import { createFreedomState, shouldEnterGround, enterGroundMode, enterNullweltMode, evaluateFreedomCycle, freedomGuidance } from "./src/freedom-guard.js";
import { discoverResearchSources } from "./src/providers.js?v=21";
const GOALS=["Geld als soziale Konstruktion und trotzdem reale Wirkung auf Miete und Essen","Mensch vor Person: Rolle durchschauen ohne Recht zu leugnen","Institutionen als gemachte Regeln mit Durchsetzung","P(sim) als Werkzeug für Freiheit, nicht als Beweis","Kleine Handlung heute, die nicht aus Geldangst kommt","Nichtlineare Zeit als Modell, Körperzeit bleibt linear"];
const AGENTS=[["Bodenwächter","Zwei Warnzeichen stoppen."],["Wertewächter","Mensch vor Rolle."],["P(sim)-Architekt","Hypothese, kein Beweis."],["Quellenleser","Wiki, Studien, Web, Wikidata."],["Sozialfilter","Diskussion ist Meinung."],["Widerspruch","Sucht Gegenbeleg."],["Konstruktion","Gemacht und wirksam."],["Mensch/Person","Wesen vor Maske."],["Nullwelt→Realwelt","Einsicht braucht Handlung."],["Risikowächter","Kein Haus, kein TV."],["Synthese","Nächster kleiner Schritt."],["Assistent","Antwortet aus Stand."],["Zeitleser","Modellzeit gegen Körperzeit."],["Geldfolge","Wirkung ohne Identifikation."],["Institutionsleser","Vertrag, Staat, Rolle."],["Gegenmodell","Entgegengesetzte Lesart."],["Körpergrenze","Vibration ist kein Beweis."],["Quellenrang","Fakt vor Meinung."],["Hypothesentrenner","P(sim) bleibt Hypothese."],["Transferprüfer","Ohne Handlung kein N."],["Fortschritt","Zählt Läufe, nicht Stimmung."],["Wiederholungssperre","Neuer Befund vor Loop."],["Realweltanker","Essen, Schlaf, Recht."],["Offenheitswächter","Unbekannt bleibt offen."]];
const KEY="eulen-home-v4";
let state=load(), active=-1;
const canvas=document.getElementById("net"), ctx=canvas.getContext("2d");
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));return {...createFreedomState(raw), n:raw.n||0, sources:raw.sources||0, chat:raw.chat||[], goalIndex:raw.goalIndex||0};}catch{return {...createFreedomState({mode:"boden"}), n:0, sources:0, chat:[], goalIndex:0};}}
function persist(){localStorage.setItem(KEY, JSON.stringify(state)); render();}
function signals(){const out={}; document.querySelectorAll("[data-signal]").forEach(input=>out[input.dataset.signal]=input.checked); return out;}
function maybeGround(reason){const next=signals(); if(shouldEnterGround(next)){state={...enterGroundMode({...state,signals:next},reason), n:state.n, sources:state.sources, chat:state.chat, goalIndex:state.goalIndex}; persist(); return true;} state.signals=next; persist(); return false;}
function render(){const g=freedomGuidance(state); const badge=document.getElementById("modeBadge"); badge.textContent=state.mode==="nullwelt"?"NULLWELT":"BODEN"; badge.className="badge "+(state.mode==="nullwelt"?"nullwelt":"boden"); document.getElementById("modeText").textContent=g.why+" "+g.action; const n=state.n||0, p=n/(n+1); document.getElementById("formula").textContent=`P(sim)=${p.toFixed(3)} · Hypothese`; document.getElementById("progressBar").style.width=`${Math.round(p*100)}%`; document.getElementById("progressText").textContent=`N=${n} · Quellen ${state.sources||0} · Ziel ${(state.goalIndex||0)+1}/${GOALS.length}`; document.getElementById("goals").innerHTML=GOALS.map((goal,i)=>`<li>${i===state.goalIndex?"<b>jetzt · </b>":""}${goal}</li>`).join(""); document.getElementById("chat").innerHTML=(state.chat||[]).slice(-6).map(item=>`<p><b>${item.role}:</b> ${item.text}</p>`).join(""); document.getElementById("enterNullwelt").disabled=Boolean(state.groundUntil&&Date.now()<Date.parse(state.groundUntil));}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height); const nodes=AGENTS.map((_,i)=>({x:70+(i%6)*140,y:55+Math.floor(i/6)*90})); ctx.strokeStyle="#24423d"; nodes.forEach((a,i)=>nodes.forEach((b,j)=>{if(j===i+1||j===i+6){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}})); nodes.forEach((node,i)=>{ctx.beginPath();ctx.fillStyle=i===active?"#7dd3c0":"#e8d6a8";ctx.arc(node.x,node.y,i===active?14:8,0,Math.PI*2);ctx.fill();}); requestAnimationFrame(draw);}
function say(role,text){state.chat=[...(state.chat||[]),{role,text}].slice(-24);}
async function runAgents(question){document.getElementById("question").value=question; document.getElementById("netStatus").textContent="Suche zu deinem Ziel. Kein Hauszugriff."; for(let i=0;i<AGENTS.length;i++){active=i; await new Promise(r=>setTimeout(r,70));} const sources=await discoverResearchSources(question); state.sources=(state.sources||0)+sources.length; state.n=(state.n||0)+1; document.getElementById("sources").innerHTML=sources.slice(0,8).map(item=>`<article class="source"><b>${item.title}</b><div class="muted">${item.provider} · ${item.kind||"quelle"}</div><p>${item.excerpt||""}</p></article>`).join(""); say("Synthese",`${sources.length} Quellen. Fakt vor Meinung. Konstruktion, Wirkung, kleine Handlung.`); document.getElementById("learnStatus").textContent=`${sources.length} Quellen zu: ${question.slice(0,80)}`; document.getElementById("netStatus").textContent="Lauf gespeichert."; persist();}
document.getElementById("auto").onclick=async()=>{if(maybeGround("Auto-Suche während Warnzeichen."))return; const q=GOALS[state.goalIndex||0]; state.goalIndex=((state.goalIndex||0)+1)%GOALS.length; try{await runAgents(q);}catch(e){document.getElementById("learnStatus").textContent=e.message||"Suche nicht erreichbar.";}};
document.getElementById("learn").onclick=async()=>{if(maybeGround("Lernen während Warnzeichen."))return; const q=document.getElementById("question").value.trim(); if(q.length<8){document.getElementById("learnStatus").textContent="Bitte konkreter.";return;} try{await runAgents(q);}catch(e){document.getElementById("learnStatus").textContent=e.message||"Suche nicht erreichbar.";}};
document.getElementById("enterGround").onclick=()=>{state={...enterGroundMode(state,"Manuell."),n:state.n,sources:state.sources,chat:state.chat,goalIndex:state.goalIndex}; persist();};
document.getElementById("enterNullwelt").onclick=()=>{const result=enterNullweltMode(state); if(result.blocked){document.getElementById("modeText").textContent=result.message;return;} state={...result,n:state.n,sources:state.sources,chat:state.chat,goalIndex:state.goalIndex}; persist();};
document.getElementById("saveTransfer").onclick=()=>{if(maybeGround("Transfer während Warnzeichen."))return; const result=evaluateFreedomCycle({construction:construction.value,effect:effect.value,smallAction:action.value}); document.getElementById("transferStatus").textContent=result.reason; if(!result.valid)return; state.transfers=[{at:new Date().toISOString(),construction:construction.value,effect:effect.value,action:action.value},...(state.transfers||[])].slice(0,20); state.n=(state.n||0)+1; say("Transfer",result.reason); persist();};
document.getElementById("send").onclick=()=>{const text=document.getElementById("chatInput").value.trim(); if(!text)return; say("Du",text); say("Assistent",`Werkzeug, kein Hausgeist. Zielagenda läuft. P(sim) ist Hypothese. ${text.slice(0,180)}`); document.getElementById("chatInput").value=""; persist();};
document.querySelectorAll("[data-signal]").forEach(input=>input.addEventListener("change",()=>maybeGround("Warnzeichen.")));
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
render(); draw();
</script>
</body>
</html>
