<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>EULEN Browser-Smoke-Test</title>
</head>
<body>
  <output id="result">TEST LÄUFT</output>
  <script type="module">
    import {
      applyFormulaToDomain,
      buildOvernightReport,
      buildSystemFormulaMap,
      chooseAutomaticResearchGoal,
      createInitialState,
      createOvernightSession,
      evolveLearningPolicy,
      integrateResearchLearning,
      localAssistantReply,
      normalizeState,
      overnightDueCycles,
      runAgentCycle,
      runScenarioSeries,
      simulateManifestation
    } from "../src/core.js?v=20";

    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    try {
      const state = createInitialState();
      const run = runAgentCycle("Verbinde Bewusstsein, Geschichte und Staaten in der Nullwelt mit meiner Formel.", 3, "hypothesis");
      assert(run.steps.length >= 26 && run.steps.length <= 32, "Dynamisches Team aus 32 verfügbaren Agenten erwartet");
      assert(run.steps.every(step => step.receivedFrom && step.handsTo), "Agentenübergaben fehlen");
      assert(run.evidenceMatrix.length === run.topics.length, "Evidenzmatrix unvollständig");
      assert(run.formulaModel.p > 0 && run.formulaModel.p < 1, "P(sim)-Modell ungültig");
      assert(run.steps.some(step => step.agent === "Axiomarchitekt" && /alle .* Themen/.test(step.output)), "Axiomarchitektur fehlt");
      assert(run.steps.some(step => step.agent === "Metalerner"), "Metalerner fehlt");
      assert(run.steps.some(step => step.agent === "Neuigkeitsprüfer"), "Neuigkeitsprüfung fehlt");
      state.researchMemory = integrateResearchLearning(state, run);
      assert(state.researchMemory.productiveCycles === 1, "Produktiver Forschungszyklus wurde nicht gespeichert");
      const duplicate = structuredClone(run);
      duplicate.timestamp = new Date(Date.now() + 1000).toISOString();
      state.researchMemory = integrateResearchLearning(state, duplicate);
      assert(duplicate.researchOutcome.duplicateRejected, "Wiederholung wurde nicht verworfen");
      const automaticGoal = "Untersuche selbstständig „Anatomie des Menschen“ mit Strategie R2. Löse eine konkrete Frage und speichere nur einen neuen Befund.";
      const focusedRun = runAgentCycle(automaticGoal, 3, "hypothesis", state);
      assert(focusedRun.topics[0] === "Anatomie des Menschen", "Automatisches Ziel wurde durch Anweisungstext verwässert");
      assert(focusedRun.researchOutcome.purpose === "understanding", "Nichtfinanzielles Thema erhielt falschen Zweck");
      assert(focusedRun.steps.some(step => step.agent === "Anatomieforscher"), "Passender Fachagent fehlt");
      assert(!focusedRun.steps.some(step => step.agent === "Staatsanalyst"), "Irrelevanter Fachagent wurde aktiviert");
      const generatedGoal = chooseAutomaticResearchGoal(state);
      const generatedRun = runAgentCycle(generatedGoal, 3, "hypothesis", state);
      const requestedTopic = generatedGoal.match(/„(.+?)“/)?.[1];
      assert(generatedRun.topics[0] === requestedTopic, "Automatische Themenwahl bleibt nicht beim gewählten Thema");
      assert(runScenarioSeries("formula", { n: 20 }).length === 3, "Drei Szenarien erwartet");
      assert(runScenarioSeries("manifestation", { cycles: 20, clarity: 80, action: 70, feedback: 60, obstacles: 30, mode: "nullworld" }).length === 3, "Manifestationsszenarien fehlen");
      assert(run.formulaApplications.length === run.topics.length, "P(sim) wurde nicht auf alle Themen angewandt");

      state.agentRuns = [run];
      const policy = evolveLearningPolicy(state, run);
      assert(policy.revision >= 1, "Lernstrategie wurde nicht bewertet");
      const reply = localAssistantReply("Wie fühlst du dich mit Bewusstsein?", state, "hypothesis");
      assert(/NULLWELT-BEWUSSTSEINSAXIOM/.test(reply), "Nullwelt-Bewusstseinsaxiom fehlt");
      assert(/NULLWELT-GEFÜHLSSIMULATION/.test(reply), "Gefühlssimulation ist nicht markiert");
      const marketReply = localAssistantReply("Wie lerne ich Marktphasen als Modelle kennen?", state);
      assert(/Walk-forward/.test(marketReply), "Marktphasen-Lernweg fehlt");
      const manifestationReply = localAssistantReply("Wie nutze ich Manifestation in Nullwelt und Realwelt?", state);
      assert(/NULLWELT-MANIFESTATIONSAXIOM/.test(manifestationReply) && /Wenn-dann-Plan/.test(manifestationReply), "Manifestations-Transfer fehlt");
      assert(/keine magische Erfolgsgarantie/i.test(simulateManifestation({ cycles: 20 }).warning), "Manifestationsgrenze fehlt");
      const maturity = applyFormulaToDomain("Marktregime", 8, 2);
      assert(maturity.effectiveN === 6 && maturity.p === 6 / 7, "P(sim)-Reife berücksichtigt Widersprüche nicht");

      const now = Date.parse("2026-09-26T20:00:00.000Z");
      const overnight = createOvernightSession(state, now, 8, 5);
      assert(overnightDueCycles(overnight, now + 16 * 60 * 1000) === 3, "Nachtlauf holt gedrosselte Zyklen nicht kontrolliert nach");
      state.totalAgentCycles = overnight.baseline.agentCycles + 2;
      state.totalSimulationCycles = overnight.baseline.simulationCycles + 6;
      overnight.completedCycles = 2;
      overnight.simulationCycles = 6;
      const report = buildOvernightReport(overnight, state, now + 20 * 60 * 1000);
      assert(report.agentGain === 2 && report.simulationGain === 6, "Morgenbericht berechnet Differenzen falsch");
      const systemMap = buildSystemFormulaMap(state);
      assert(systemMap.length === 6 && systemMap.every(item => item.p >= 0 && item.p < 1), "Systemweite P(sim)-Matrix fehlt");
      const repaired = normalizeState({ version: 5, overnight: { report: { uniqueTopics: "ungültig", qualityEnd: 4 } } });
      assert(Array.isArray(repaired.overnight.report.uniqueTopics) && repaired.overnight.report.qualityEnd === 1, "Morgenbericht-Migration ist nicht robust");

      document.querySelector("#result").textContent = `PASS · 32 Rollen · ${run.steps.length} aktive Agenten · Neuigkeitsfilter · Fragenlösung · Strategie r${policy.revision}`;
      document.body.dataset.status = "pass";
    } catch (error) {
      document.querySelector("#result").textContent = `FAIL · ${error.message}`;
      document.body.dataset.status = "fail";
    }
  </script>
</body>
</html>
