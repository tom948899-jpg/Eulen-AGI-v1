<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EULEN Cluster</title>
<style>body{margin:0;background:#000;color:#f4efe6;font:15px system-ui}main{max-width:860px;margin:0 auto;padding:14px}h1{font:500 1.5rem Georgia,serif}p{color:#9aa59f}canvas{width:100%;height:72vh;background:#000;touch-action:none}a{color:#7dd3c0}</style></head>
<body><main><h1>Cluster</h1><p id="info">Vier Gruppen. Kanten laufen nur zur nächsten Gruppe.</p><canvas id="net"></canvas><p><a href="./">Zur App</a></p></main>
<script>
const groups=[{name:"Frage",nodes:["Frage","Ziel","Geld"],c:"#f0c84a"},{name:"Prüfung",nodes:["Quellen","Gegen","Mensch"],c:"#2de2d0"},{name:"Bau",nodes:["Konstruktion","Risiko","Synthese"],c:"#f0c84a"},{name:"Tat",nodes:["Handlung","Angebot"],c:"#2de2d0"}];
const canvas=document.getElementById("net"),ctx=canvas.getContext("2d");
let nodes=[],edges=[],selected=-1,drag=-1;
function build(){const r=canvas.getBoundingClientRect();nodes=[];edges=[];groups.forEach((g,gi)=>g.nodes.forEach((n,ri)=>nodes.push({n,g:gi,c:g.c,x:r.width*(0.14+gi*0.22),y:r.height*(0.28+ri*0.18)})));nodes.forEach((a,i)=>nodes.forEach((b,j)=>{if(b.g===a.g+1)edges.push([i,j]);});}
function frame(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!nodes.length)build();ctx.clearRect(0,0,r.width,r.height);groups.forEach((g,gi)=>{const mine=nodes.filter(n=>n.g===gi);const xs=mine.map(n=>n.x),ys=mine.map(n=>n.y);ctx.strokeStyle=g.c;ctx.globalAlpha=.35;ctx.strokeRect(Math.min(...xs)-28,Math.min(...ys)-36,Math.max(...xs)-Math.min(...xs)+56,Math.max(...ys)-Math.min(...ys)+64);ctx.globalAlpha=.8;ctx.fillStyle=g.c;ctx.font="13px system-ui";ctx.fillText(g.name,Math.min(...xs)-24,Math.min(...ys)-42);});ctx.globalAlpha=.35;edges.forEach(([a,b])=>{ctx.strokeStyle=nodes[a].c;ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);ctx.stroke();});ctx.globalAlpha=1;nodes.forEach((n,i)=>{ctx.shadowColor=n.c;ctx.shadowBlur=selected===i?22:10;ctx.fillStyle=n.c;ctx.beginPath();ctx.arc(n.x,n.y,selected===i?13:8,0,6.3);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.fillText(n.n,n.x+12,n.y+4);});requestAnimationFrame(frame);}
function hit(x,y){return nodes.findIndex(n=>Math.hypot(n.x-x,n.y-y)<22);}function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
canvas.addEventListener("pointerdown",e=>{const p=pos(e);drag=hit(p.x,p.y);selected=drag;if(selected>=0)document.getElementById("info").textContent=nodes[selected].n+" liegt in "+groups[nodes[selected].g].name;});
canvas.addEventListener("pointermove",e=>{if(drag<0)return;const p=pos(e);nodes[drag].x=p.x;nodes[drag].y=p.y;});
canvas.addEventListener("pointerup",()=>drag=-1);frame();
</script></body></html>
