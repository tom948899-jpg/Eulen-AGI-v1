<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EULEN Netz</title>
<style>
body{margin:0;background:#000;color:#f4efe6;font:16px/1.4 system-ui,sans-serif}
main{max-width:800px;margin:0 auto;padding:16px}
h1{font:500 1.6rem Georgia,serif}p{color:#9aa59f}canvas{width:100%;height:70vh;background:#000;touch-action:none;border-radius:16px}
</style>
</head>
<body>
<main>
<h1>Interaktives Netz</h1>
<p id="info">Zieh einen Knoten. Tippe ihn an, dann leuchten nur seine Einflüsse.</p>
<canvas id="net"></canvas>
<p><a href="./" style="color:#7dd3c0">Zurück zur App</a></p>
</main>
<script>
const names=["Frage","Ziel","Geld","Quellen","Gegen","Mensch","Konstruktion","Risiko","Synthese","Handlung"];
const colors=["#f0c84a","#f0c84a","#f0c84a","#2de2d0","#2de2d0","#2de2d0","#f0c84a","#f0c84a","#2de2d0","#2de2d0"];
const links=[[0,3],[0,4],[1,3],[1,5],[2,6],[3,6],[4,6],[4,7],[5,8],[6,8],[7,8],[8,9],[3,8],[6,9]];
const canvas=document.getElementById("net"), ctx=canvas.getContext("2d");
let nodes=[], selected=-1, drag=-1;
function layout(){const r=canvas.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!nodes.length)nodes=names.map((name,i)=>({name,c:colors[i],x:r.width*(0.15+(i%5)*0.17),y:r.height*(i<5?0.32:0.68)}));}
function draw(){layout();const w=canvas.getBoundingClientRect().width,h=canvas.getBoundingClientRect().height;ctx.clearRect(0,0,w,h);links.forEach(([a,b])=>{const on=selected<0||selected===a||selected===b;ctx.globalAlpha=on?.55:.08;ctx.strokeStyle=nodes[a].c;ctx.lineWidth=on?2:1;ctx.shadowColor=nodes[a].c;ctx.shadowBlur=on?12:0;ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.quadraticCurveTo((nodes[a].x+nodes[b].x)/2,(nodes[a].y+nodes[b].y)/2-30,nodes[b].x,nodes[b].y);ctx.stroke();});ctx.globalAlpha=1;nodes.forEach((node,i)=>{ctx.shadowColor=node.c;ctx.shadowBlur=selected===i?28:16;ctx.fillStyle=node.c;ctx.beginPath();ctx.arc(node.x,node.y,selected===i?16:11,0,6.3);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="13px system-ui";ctx.fillText(node.name,node.x+16,node.y+4);});requestAnimationFrame(draw);}
function hit(x,y){return nodes.findIndex(node=>Math.hypot(node.x-x,node.y-y)<22);}
function pos(e){const r=canvas.getBoundingClientRect(), p=e.touches?e.touches[0]:e;return {x:p.clientX-r.left,y:p.clientY-r.top};}
canvas.addEventListener("pointerdown",e=>{const p=pos(e);drag=hit(p.x,p.y);selected=drag;if(selected>=0)document.getElementById("info").textContent=nodes[selected].name+" beeinflusst "+links.filter(link=>link.includes(selected)).map(link=>nodes[link[0]===selected?link[1]:link[0]].name).join(", ");});
canvas.addEventListener("pointermove",e=>{if(drag<0)return;const p=pos(e);nodes[drag].x=p.x;nodes[drag].y=p.y;});
canvas.addEventListener("pointerup",()=>drag=-1);
draw();
</script>
</body>
</html>
